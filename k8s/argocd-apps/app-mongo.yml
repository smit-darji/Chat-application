apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat-mongo
  namespace: argocd
spec:
  project: chat-project
  source:
    repoURL: https://github.com/selfHeal-darji/Chat-application.git
    targetRevision: Master
    path: k8s
    directory:
      recurse: true
      include: mongodb-*.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: chat-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
